<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Budget Margin">
  <meta name="theme-color" content="#07141B">
  <meta name="description" content="Budget Margin — local-first envelope budgeting with receipt scanning, statement checks and an assistant that answers from your own numbers.">
  <meta name="application-name" content="Budget Margin">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="stylesheet" href="./css/app.css">
  <title>Budget Margin</title>
  <script>
    /* paint the saved theme before the modules load, so there's no flash */
    try { var s = JSON.parse(localStorage.getItem("margin.v2") || "{}"); if (s.theme === "coral") document.documentElement.dataset.theme = "coral"; } catch (e) { }
  </script>
</head>
<body>
  <main class="wrap">
    <section class="screen" id="s-home" aria-label="Home"></section>
    <section class="screen" id="s-activity" aria-label="Activity"></section>
    <section class="screen" id="s-plan" aria-label="Plan"></section>
    <section class="screen" id="s-ask" aria-label="Ask"></section>
    <section class="screen" id="s-settings" aria-label="Settings"></section>
  </main>

  <nav class="tabbar" aria-label="Main">
    <div class="tabbar-in">
      <button class="tab-btn badge-dot" id="tabHome" data-go="home" type="button"><svg class="ico" viewBox="0 0 24 24"><path d="m4 11 8-7 8 7v9h-5v-6h-6v6H4v-9Z"/></svg>Home</button>
      <button class="tab-btn" data-go="activity" type="button"><svg class="ico" viewBox="0 0 24 24"><path d="M8 7h12M8 12h12M8 17h12M4 7h.01M4 12h.01M4 17h.01"/></svg>Activity</button>
      <button class="fab" id="fab" type="button" aria-label="Add"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="tab-btn" data-go="plan" type="button"><svg class="ico" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>Plan</button>
      <button class="tab-btn" data-go="ask" type="button"><svg class="ico" viewBox="0 0 24 24"><path d="M5 5h14v10H9l-4 4V5Z"/><path d="M9 9h6M9 12h4"/></svg>Ask</button>
    </div>
  </nav>

  <div class="sheet" id="sheet" aria-hidden="true"><div class="sheet-box" id="sheetBox" role="dialog" aria-modal="true"></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastUndo" type="button" hidden>Undo</button></div>

  <input type="file" id="fileReceipt" accept="image/*" class="sr" tabindex="-1" aria-hidden="true">
  <input type="file" id="fileStatement" accept=".csv,.txt,.pdf,text/csv,text/plain,application/pdf" class="sr" tabindex="-1" aria-hidden="true">
  <input type="file" id="fileHistorical" accept=".csv,text/csv" class="sr" tabindex="-1" aria-hidden="true">
  <input type="file" id="fileRestore" accept=".json,application/json" class="sr" tabindex="-1" aria-hidden="true">

  <noscript><p style="padding:24px">Budget Margin needs JavaScript.</p></noscript>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
